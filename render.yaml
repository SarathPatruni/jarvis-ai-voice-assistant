services:
  - type: web
    name: jarvis-ai-voice-assistant
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run web/app.py --server.address 0.0.0.0 --server.port $PORT --server.headless true
    envVars:
      - key: GEMINI_API_KEY
        sync: false
